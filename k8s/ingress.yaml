apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-copilot-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ops-copilot-svc
            port:
              number: 80
