apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-copilot-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ops-copilot
  template:
    metadata:
      labels:
        app: ops-copilot
    spec:
      containers:
      - name: backend-service
        image: acropscopilotprod.azurecr.io/ops-copilot:v1
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ops-copilot-svc
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: ops-copilot
